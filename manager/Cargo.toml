[package]
name = "mc_server_seeker_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
data_core = { path = "../data_core" }

env_logger = "0.11"
log = "0.4"
thiserror = "2.0"
itertools = "0.15"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
futures = "0.3"
tonic = { version = "0.14", features = ["tls-ring"] }
reqwest = { version = "0.13", features = ["json"] }
sqlx = "0.9"
uuid = "1.24"
toml = "1.1"
ipnetwork = { version = "0.21", features = ["serde"] }
chrono = "0.4"
url = { version = "2.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

axum = { version = "0.8" }
utoipa = { version = "5.5", features = ["axum_extras"] }
scalar_api_reference = { version = "0.2", features = ["axum"] }