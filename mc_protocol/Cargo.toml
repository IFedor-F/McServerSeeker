[package]
name = "mc_protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v3", "v4"] }
fastrand = "2.5"
bytes = "1.12"
thiserror = "2.0"
flate2 = "1.1.9"
md5 = "0.8.0"
log = "0.4"
hickory-resolver = "0.26"

[dev-dependencies]
testcontainers = { version = "0.28" }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15.0"
env_logger = "0.11"
