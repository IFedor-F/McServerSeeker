[package]
name = "data_core"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-native-tls", "chrono", "uuid", "ipnetwork"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
ipnetwork = { version = "0.21", features = ["serde"] }
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
mc_protocol = { path = "../mc_protocol" }
serde = { version = "1.0", features = ["derive"] }
cron = "0.17.0"
url = { version = "2.5", features = ["serde"] }
utoipa = { version = "5.5", features = ["uuid", "url"] }
itertools = "0.15"
serde_json = "1.0"
thiserror = "2.0.20"

[build-dependencies]
tonic-prost-build = "0.14"