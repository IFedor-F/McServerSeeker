[package]
name = "NgrokServerSeeker"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "tls-native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.100"
uuid = { version = "1.23.4", features = ["v3", "v4"] }
chrono = "0.4.45"
fastrand = "2.4.1"
bytes = "1.12.0"
thiserror = "2.0.18"
flate2 = "1.1.9"
md5 = "0.8.0"
