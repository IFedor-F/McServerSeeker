name: Build Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Worker
        id: meta_worker
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ifedor-f/mc_server_seeker_worker
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Worker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: mc_server_seeker_worker
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Manager
        id: meta_manager
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ifedor-f/mc_server_seeker_manager
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Manager Image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: mc_server_seeker_manager
          push: true
          tags: ${{ steps.meta_manager.outputs.tags }}
          labels: ${{ steps.meta_manager.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max